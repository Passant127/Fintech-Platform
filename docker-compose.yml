services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fintech-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Fintech@12345"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  rabbitmq:
    image: rabbitmq:3-management
    container_name: fintech-rabbitmq
    ports:
      - "5672:5672"     # used by your app
      - "15672:15672"   # web management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  redis:
    image: redis:7
    container_name: fintech-redis
    ports:
      - "6379:6379"

volumes:
  sqlserver-data: